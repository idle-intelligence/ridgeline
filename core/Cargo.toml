[package]
name = "ridgeline-core"
version = "0.1.0"
edition = "2021"
description = "Heightfield container for ridgeline, a solar-system globe explorer: decodes and owns the int16 elevation buffer for the JS/WGSL shell (Rust → WASM)."
license = "MIT"
repository = "https://github.com/idle-intelligence/ridgeline"
authors = ["ilnmtlbnm"]
keywords = ["wasm", "webgpu", "heightfield", "terrain", "globe"]
categories = ["wasm", "graphics", "visualization"]

[lib]
# rlib alongside cdylib so the crate is unit-testable and usable as a normal dependency.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
