[package]
name = "ridgeline-core"
version = "0.1.0"
edition = "2021"
description = "Spherical-world mapping, flight physics, and ridgeline geometry generation for the ridgeline globe-flight game (Rust → WASM)."
license = "MIT"
repository = "https://github.com/ilnmtlbnm/ridgeline"
authors = ["ilnmtlbnm"]
keywords = ["wasm", "webgpu", "geometry", "physics", "globe"]
categories = ["wasm", "game-development", "graphics"]

[lib]
# rlib alongside cdylib so the crate is unit-testable and usable as a normal dependency.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
