<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ridgeline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0a14;
      overflow: hidden;
    }

    #c {
      display: block;
      width: 100%; height: 100%;
    }

    /* Loading / error overlay */
    #overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: fixed;
      inset: 0;
      background: rgba(4, 4, 10, 0.92);
      color: #e0ddd8;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
    }

    #overlay p.err  { color: #c0624a; }
    #overlay p.hint { color: #7a7870; font-size: 12px; max-width: 420px; text-align: center; }

    /* HUD — minimal, bottom-left */
    #hud {
      position: fixed;
      bottom: 14px;
      left: 16px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      color: rgba(200, 196, 188, 0.55);
      letter-spacing: 0.05em;
      pointer-events: none;
      user-select: none;
    }

    /* Controls hint — top-right, fades after interaction */
    #controls {
      position: fixed;
      top: 14px;
      right: 16px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      color: rgba(200, 196, 188, 0.35);
      line-height: 1.7;
      pointer-events: none;
      user-select: none;
      text-align: right;
      transition: opacity 1s;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="overlay"><p>Initializing…</p></div>

  <div id="hud"></div>

  <div id="controls">
    Z / ↑ &nbsp;forward &nbsp;&nbsp;&nbsp;S / ↓ &nbsp;back<br>
    Q / ← &nbsp;left &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;D / → &nbsp;right<br>
    A / E &nbsp;&nbsp;roll<br>
    Shift &nbsp;boost &nbsp;&nbsp;&nbsp;Space &nbsp;FTL<br>
    click to capture mouse
  </div>

  <script type="module" src="./main.js"></script>

  <script>
    // Fade controls hint after first keydown
    window.addEventListener('keydown', () => {
      document.getElementById('controls').style.opacity = '0';
    }, { once: true });
  </script>
</body>
</html>
