<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ridgeline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0a14;
      overflow: hidden;
    }

    #c {
      display: block;
      width: 100%; height: 100%;
      touch-action: none;          /* stop scroll/pinch/zoom gestures over the canvas */
      -webkit-user-select: none;
      user-select: none;
    }

    /* Loading / error overlay */
    #overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: fixed;
      inset: 0;
      background: rgba(4, 4, 10, 0.92);
      color: #e0ddd8;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
    }

    #overlay p.err  { color: #c0624a; }
    #overlay p.hint { color: #7a7870; font-size: 12px; max-width: 420px; text-align: center; }

    /* HUD — bottom-left, readable at a glance */
    #hud {
      position: fixed;
      bottom: 16px;
      left: 18px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      font-weight: bold;
      color: rgba(220, 216, 208, 0.85);
      letter-spacing: 0.08em;
      pointer-events: none;
      user-select: none;
    }

    /* Controls hint — top-right, fades after interaction */
    #controls {
      position: fixed;
      top: 14px;
      right: 16px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      color: rgba(200, 196, 188, 0.35);
      line-height: 1.7;
      pointer-events: none;
      user-select: none;
      text-align: right;
      transition: opacity 1s;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="overlay"><p>Initializing…</p></div>

  <div id="hud"></div>

  <div id="controls">
    W / ↑ &nbsp;pitch down &nbsp;S / ↓ &nbsp;pitch up<br>
    A / ← &nbsp;roll left &nbsp;&nbsp;D / → &nbsp;roll right<br>
    Q / E &nbsp;&nbsp;yaw left / right (rudder)<br>
    Shift &nbsp;throttle up &nbsp;Ctrl &nbsp;throttle down<br>
    Space &nbsp;afterburner<br>
    Mouse &nbsp;freelook (view only)<br>
    Touch &nbsp;drag to look (view only)<br>
    click to capture mouse
  </div>

  <script type="module" src="./main.js"></script>

  <script>
    // Fade controls hint after first keydown
    window.addEventListener('keydown', () => {
      document.getElementById('controls').style.opacity = '0';
    }, { once: true });
  </script>
</body>
</html>
