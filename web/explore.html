<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>ridgeline — explore</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; }
    canvas { display:block; width:100vw; height:100vh; }
    #info {
      position:fixed; top:16px; left:16px;
      font:12px/1.7 monospace; color:#555; pointer-events:none;
      white-space: pre;
    }
    #timectl {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      display:flex; gap:6px; align-items:center;
    }
    .tb {
      background:#0a0a0a; border:1px solid #2a2a2a; color:#666;
      padding:5px 11px; cursor:pointer; font:11px monospace; border-radius:2px;
    }
    .tb:hover { border-color:#555; color:#ccc; }
    .tb.on { border-color:#777; color:#ddd; }
    #nowgpu {
      display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      color:#666; font:14px monospace; text-align:center; line-height:2;
    }
    #loading {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:14px;
      background:#000; color:#888; font:13px monospace; z-index:10;
    }
    #loading .title { color:#ccc; letter-spacing:2px; }
    #loadbar { width:220px; height:2px; background:#1a1a1a; overflow:hidden; }
    #loadfill { height:100%; width:0%; background:#6aa3ff; transition:width .15s ease; }
    #loadpct { color:#555; font-size:11px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="loading">
    <div class="title">RIDGELINE · EXPLORE</div>
    <div id="loadbar"><div id="loadfill"></div></div>
    <div id="loadpct">loading terrain…</div>
  </div>
  <div id="info"></div>
  <div id="timectl">
    <button class="tb" data-s="0">⏸</button>
    <button class="tb" data-s="1">1×</button>
    <button class="tb" data-s="100">100×</button>
    <button class="tb on" data-s="1000">1k×</button>
    <button class="tb" data-s="10000">10k×</button>
  </div>
  <div id="nowgpu">WebGPU required for explore mode.<br>Try Chrome 113+ or Safari 18+.</div>
  <script type="module" src="explore.js"></script>
</body>
</html>
